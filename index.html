<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Yahoo Finance Data Merging</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-blue-950 text-white flex items-center justify-center p-6">

  <main class="w-full max-w-2xl bg-slate-900/90 rounded-3xl shadow-2xl border border-slate-700 p-8">

    <h1 class="text-4xl font-bold text-center mb-3">
      Yahoo Finance Data Merging
    </h1>

    <p class="text-center text-slate-300 mb-8">
      הזיני סימולי מניות, תאריכים ותדירות כדי ליצור גיליון Google Sheets מאוחד
    </p>

    <form id="stockForm" class="space-y-6">

      <div>
        <label class="block mb-2 font-semibold text-lg">
          סימולי מניות
        </label>

        <input
          id="tickers"
          type="text"
          placeholder="AAPL, AMZN, TSLA"
          class="w-full p-4 rounded-xl bg-slate-800 border border-slate-600 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
          required
        />

        <p class="text-sm text-slate-400 mt-2">
          יש להפריד באמצעות פסיקים
        </p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

        <div>
          <label class="block mb-2 font-semibold">
            תאריך התחלה
          </label>

          <input
            id="startDate"
            type="date"
            class="w-full p-4 rounded-xl bg-slate-800 border border-slate-600 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          />
        </div>

        <div>
          <label class="block mb-2 font-semibold">
            תאריך סיום
          </label>

          <input
            id="endDate"
            type="date"
            class="w-full p-4 rounded-xl bg-slate-800 border border-slate-600 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          />
        </div>

      </div>

      <div>
        <label class="block mb-2 font-semibold">
          תדירות
        </label>

        <select
          id="frequency"
          class="w-full p-4 rounded-xl bg-slate-800 border border-slate-600 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="1d">Daily - יומי</option>
          <option value="1wk">Weekly - שבועי</option>
          <option value="1mo">Monthly - חודשי</option>
        </select>
      </div>

      <button
        type="submit"
        id="submitBtn"
        class="w-full bg-blue-600 hover:bg-blue-700 transition rounded-xl p-4 font-bold text-lg shadow-lg disabled:bg-slate-600 disabled:cursor-not-allowed"
      >
        יצירת גיליון מאוחד
      </button>

    </form>

    <div
      id="loading"
      class="hidden mt-6 bg-yellow-900/30 border border-yellow-500 rounded-xl p-4 text-center text-yellow-200"
    >
      טוען נתונים... נא להמתין
    </div>

    <div
      id="success"
      class="hidden mt-6 bg-green-900/30 border border-green-500 rounded-xl p-5 text-center"
    >
      <p class="font-bold text-green-200 mb-4">
        הגיליון נוצר בהצלחה!
      </p>

      <a
        id="sheetLink"
        href="#"
        target="_blank"
        class="inline-block bg-green-600 hover:bg-green-700 transition px-5 py-3 rounded-lg font-bold"
      >
        פתיחת Google Sheets
      </a>
    </div>

    <div
      id="error"
      class="hidden mt-6 bg-red-900/30 border border-red-500 rounded-xl p-4 text-center text-red-200"
    ></div>

  </main>

  <script>

    // כתובת ה-Web App המעודכנת
    const WEB_APP_URL =
      "https://script.google.com/macros/s/AKfycbz1i61xPhqSZTnqujI8vuEUFyIu07No4HF7eyOlTomCHKHrQ_G8lprAzkKVmIHCHNUy/exec";

    const form = document.getElementById("stockForm");
    const loading = document.getElementById("loading");
    const success = document.getElementById("success");
    const errorBox = document.getElementById("error");
    const submitBtn = document.getElementById("submitBtn");
    const sheetLink = document.getElementById("sheetLink");

    form.addEventListener("submit", async function (e) {

      e.preventDefault();

      success.classList.add("hidden");
      errorBox.classList.add("hidden");
      loading.classList.remove("hidden");

      submitBtn.disabled = true;
      submitBtn.textContent = "מעבד נתונים...";

      try {

        // קבלת הטיקרים
        const tickers = document
          .getElementById("tickers")
          .value
          .split(",")
          .map(ticker => ticker.trim().toUpperCase())
          .filter(ticker => ticker !== "");

        const startDate = document.getElementById("startDate").value;
        const endDate = document.getElementById("endDate").value;
        const frequency = document.getElementById("frequency").value;

        // בדיקות תקינות
        if (tickers.length === 0) {
          throw new Error("יש להזין לפחות סימול מניה אחד");
        }

        if (!startDate || !endDate) {
          throw new Error("יש לבחור תאריכים");
        }

        if (new Date(startDate) > new Date(endDate)) {
          throw new Error("תאריך התחלה לא יכול להיות אחרי תאריך סיום");
        }

        // יצירת גוף הבקשה
        const requestData = {
          tickers,
          startDate,
          endDate,
          frequency
        };

        // שליחת POST לשרת Apps Script
        const response = await fetch(WEB_APP_URL, {
          method: "POST",

          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },

          body: JSON.stringify(requestData)
        });

        // קבלת תשובה
        const data = await response.json();

        // הצלחה
        if (data.sheetUrl) {

          sheetLink.href = data.sheetUrl;

          success.classList.remove("hidden");

        } else {

          throw new Error(data.error || "אירעה שגיאה");

        }

      } catch (error) {

        errorBox.textContent = "שגיאה: " + error.message;

        errorBox.classList.remove("hidden");

      } finally {

        loading.classList.add("hidden");

        submitBtn.disabled = false;

        submitBtn.textContent = "יצירת גיליון מאוחד";
      }

    });

  </script>

</body>
</html>
